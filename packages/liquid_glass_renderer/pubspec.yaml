name: liquid_glass_plus
description: >-
  Create stunning liquid glass and frosted glass effects in Flutter using
  custom shaders. Supports iOS, macOS, and Android with Impeller rendering.
version: 0.3.0

homepage: https://vespr.xyz
repository: https://github.com/vespr-wallet/flutter_liquid_glass_plus/tree/main/packages/liquid_glass_renderer
issue_tracker: https://github.com/vespr-wallet/flutter_liquid_glass_plus/issues
screenshots:
  - description: "A title image with three liquid glass elements"
    path: doc/screenshot.png  

topics:
  - liquid-glass
  - apple
  - shaders
  - flutter
  - effects

environment:
  sdk: ">=3.0.0 <4.0.0"
  # Flutter 3.32.4+ required for RoundedSuperellipseBorder and shader fixes
  flutter: ">=3.32.4"

# Non-impeller platforms are using a shader approximation with linear transformations
# and backdrop filters instead of custom shaders.
platforms:
  macos:
  ios:
  android:
  linux:
  windows:
  web:

dependencies:
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_shaders: ^0.1.3
  logging: ^1.3.0
  meta: ^1.16.0
  motor: ^1.0.1

dev_dependencies:
  alchemist: ^0.12.1
  flutter_test:
    sdk: flutter
  lintervention: ^0.3.1
  mocktail: ^1.0.3

flutter:
  shaders:
    - lib/assets/shaders/liquid_glass_geometry_blended.frag
    - lib/assets/shaders/liquid_glass_final_render.frag
