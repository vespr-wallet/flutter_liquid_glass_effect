name: liquid_glass_renderer
description: >-
  Create stunning liquid glass and frosted glass effects in Flutter using
  custom shaders. Supports iOS, macOS, and Android with Impeller rendering.
version: 0.3.0

homepage: https://whynotmake.it
repository: https://github.com/whynotmake-it/flutter_liquid_glass/tree/main/packages/liquid_glass_renderer
issue_tracker: https://github.com/whynotmake-it/flutter_liquid_glass/issues
screenshots:
  - description: "A title image with three liquid glass elements"
    path: doc/screenshot.png  

topics:
  - liquid-glass
  - apple
  - shaders
  - flutter
  - effects

environment:
  sdk: ">=3.0.0 <4.0.0"
  # Flutter 3.32.4+ required for RoundedSuperellipseBorder and shader fixes
  flutter: ">=3.32.4"

# We only support Platforms that support Impeller.
platforms:
  macos:
  ios:
  android:

dependencies:
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_shaders: ^0.1.3
  logging: ^1.3.0
  meta: ^1.16.0
  motor: ^1.0.1

dev_dependencies:
  alchemist: ^0.12.1
  flutter_test:
    sdk: flutter
  lintervention: ^0.3.1
  mocktail: ^1.0.3

flutter:
  shaders:
    - lib/assets/shaders/liquid_glass_geometry_blended.frag
    - lib/assets/shaders/liquid_glass_final_render.frag
